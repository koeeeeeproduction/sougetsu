<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sowveil</title>
<link rel="stylesheet" href="css/sowveil.css">
</head>
<body>
<div id="app">
  <div id="banners"></div>
  <header class="topbar" id="topbar">
    <button class="round-btn logo-btn" id="logoBtn" title="Settings" aria-label="Settings"></button>
    <div class="tabs-scroll" id="tabsScroll">
      <div class="seg" id="seg"><div class="seg-pill" id="segPill"></div></div>
    </div>
    <button class="round-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"></button>
  </header>
  <div class="body-row" id="bodyRow">
    <nav class="rail" id="rail"></nav>
    <main class="content" id="content"></main>
  </div>
  <footer class="statusbar">
    <div class="sb-left"><span class="dot" id="connDot"></span><span id="connText">Disconnected</span><span class="sep">·</span><span id="selText">—</span></div>
    <div class="sb-right" id="verText">Sowveil</div>
  </footer>
</div>
<div class="modal-wrap" id="settings" hidden></div>
<div class="toast" id="toast"></div>

<script src="js/CSInterface.js"></script>
<script src="js/core.js"></script>

<script src="js/vendor/preview/formulas/text.js"></script>
<script src="js/vendor/preview/formulas/index.js"></script>
<script src="js/vendor/preview/render.js"></script>
<script src="js/vendor/preview/textanimator.js"></script>
<script src="js/vendor/preview/easing-graph.js"></script>
<script src="js/vendor/preview/engine.js"></script>
<script src="js/tabs/text.js"></script>
